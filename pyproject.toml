[project]
name = "plot3d"
version = "1.11.1"
description = "Plot3D python utilities for reading and writing and also finding connectivity between blocks"
authors = [{ name = "Paht Juangphanich", email = "paht.juangphanich@nasa.gov" }]
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "tqdm",
    "networkx",
    "metis-rs",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
hdf5 = ["h5py"]
docs = ["sphinx>=7.4,<8", "sphinx-rtd-theme>=2.0,<3", "sphinx-autobuild>=2024.4,<2025"]
examples = ["pyturbo-aero"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plot3d"]
